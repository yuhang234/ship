name = "ship-oauth"
main = "src/index.ts"
compatibility_date = "2026-01-01"

[vars]
# 真实的 GitHub OAuth App Client ID（应用名 ship，回调指向下面的 Worker /callback）
GITHUB_CLIENT_ID = "Ov23liPCcOFzf3e8DAxM"
# 站点 origin（GitHub Pages 域名），多个用英文逗号分隔
ALLOWED_ORIGINS = "https://yuhang234.github.io"

# 只允许站长本人登录：其他人的 token 会在 Worker 里被直接拒绝，
# 所以即使别人打开 /studio/ 先授权成功，也无法把内容写进这个仓库。
GITHUB_ALLOWED_LOGINS = "yuhang234"

# GITHUB_CLIENT_SECRET 不要写在这里，用：npx wrangler secret put GITHUB_CLIENT_SECRET